services:
  - type: web
    name: giguiya-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: giguiya
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://tounkara-djigui.github.io/giguiya_pages
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL_DOMAIN
        value: giguiya.it
      - key: EMAIL_FROM_NAME
        value: Giguiya
      - key: EMAIL_REPLY_TO
        sync: false
      - key: SMTP_HOST
        value: smtps.aruba.it
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
